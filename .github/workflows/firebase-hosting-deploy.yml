# Publica la app en Firebase Hosting (comedor-86278.web.app) cada vez que se une algo a main.
# La app de Play Store carga esa página, así que el cambio llega a los teléfonos sin subir otra versión.
#
# Requiere el secreto de GitHub FIREBASE_SERVICE_ACCOUNT con la llave JSON de una cuenta de servicio
# de Firebase (Configuración del proyecto → Cuentas de servicio → Generar nueva clave privada).
name: Publicar en Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minifica JS/CSS al publicar (scripts/build-hosting.js corre como predeploy).
      # esbuild es dependencia del proyecto. Este job no instala todo node_modules;
      # si no está, lo baja aquí para que el predeploy no publique sin minificar.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar esbuild (minificar hosting)
        run: |
          if [ -d node_modules/esbuild ]; then
            echo "esbuild ya está en node_modules"
          else
            VER=$(node -p "require('./package.json').dependencies.esbuild")
            npm install --prefix "$RUNNER_TEMP/esb" "esbuild@${VER}"
            echo "ESBUILD_PATH=$RUNNER_TEMP/esb/node_modules/esbuild" >> "$GITHUB_ENV"
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: comedor-86278
          channelId: live
